name: Python Docker CI/CD

on:
  push:
    branches:
      - main  # triggers workflow on main branch

jobs:
  docker-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: DockerHub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  
      - name: Build Docker image
        run: docker build -t vishnu8150hub/app:latest .

      
      - name: Push Docker image
        run: docker push vishnu8150hub/app:latest


      - name: Run Docker container
        run: |
          docker stop app || true
          docker rm app || true
          docker run -d --name app -p 5000:5000 vishnu8150hub/app:latest
